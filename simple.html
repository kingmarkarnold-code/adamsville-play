<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Surviving Adamsville — Play</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0e14;height:100%;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#dfe7f2;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;pointer-events:none;
    background:linear-gradient(rgba(5,8,14,.85),transparent);}
  #hud h1{font-size:15px;margin:0;letter-spacing:.4px;}
  #hud .sub{font-size:11px;color:#9aa7bd;margin-top:2px;}
  #devbadge{position:absolute;top:10px;right:14px;font-size:11px;color:#7fd0ff;
    background:rgba(20,30,45,.8);padding:4px 10px;border-radius:10px;pointer-events:none;}
  /* virtual joystick (touch only) */
  #joy{position:absolute;left:24px;bottom:24px;width:120px;height:120px;display:none;
    border:2px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(255,255,255,.06);}
  #stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(255,255,255,.35);}
  #btns{position:absolute;right:24px;bottom:24px;display:none;gap:12px;}
  #btns button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;font-size:13px;}
  #minimap{position:absolute;right:14px;top:54px;width:140px;height:180px;
    background:rgba(10,14,22,.75);border:1px solid #2c384a;border-radius:8px;pointer-events:none;}
  #minimap canvas{width:100%;height:100%;}
  #radiobtn{position:absolute;top:12px;right:60px;font-size:24px;cursor:pointer;
    background:rgba(10,14,22,.65);padding:8px 12px;border-radius:12px;}
  #radiopop{position:absolute;top:60px;right:12px;background:rgba(10,14,22,.92);
    border:1px solid #2c384a;border-radius:12px;padding:12px;z-index:20;text-align:center;}
  #radiopop button{margin:4px;padding:8px 12px;font-size:16px;cursor:pointer;
    background:#1a2230;color:#fff;border:1px solid #2c384a;border-radius:8px;}
  #rp-title{font-size:12px;color:#7d8aa3;letter-spacing:2px;margin-bottom:4px;}
  #rp-track{font-size:14px;color:#39ff6a;margin-bottom:8px;}
  #streetname{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    font-size:16px;font-weight:bold;color:#fff;background:rgba(10,14,22,.65);
    padding:8px 20px;border-radius:14px;pointer-events:none;letter-spacing:.5px;}
  #speedo{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
    font-size:18px;font-weight:bold;color:#39ff6a;background:rgba(10,14,22,.65);
    padding:8px 18px;border-radius:12px;pointer-events:none;}
  #detailed-link{position:absolute;top:12px;left:12px;font-size:13px;color:#39ff6a;
    background:rgba(10,14,22,.65);padding:8px 14px;border-radius:10px;text-decoration:none;}
  #kbhints{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:12px;color:#7d8aa3;background:rgba(10,14,22,.6);padding:6px 14px;
    border-radius:12px;pointer-events:none;white-space:nowrap;}
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#0a0e14;z-index:10;}
  #loading .icon{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 12px #39ff6a);}
  #loading h2{font-size:20px;letter-spacing:2px;color:#39ff6a;margin:0 0 6px;
    text-shadow:0 0 18px rgba(57,255,106,.6);}
  #loading .tag{font-size:12px;color:#9aa7bd;margin-bottom:24px;letter-spacing:1px;}
  #lbarwrap{width:min(320px,70vw);height:10px;background:#1a2230;border-radius:5px;
    border:1px solid #2c384a;overflow:hidden;}
  #lbar{height:100%;width:0%;background:linear-gradient(90deg,#39ff6a,#7fff9e);
    box-shadow:0 0 12px #39ff6a;transition:width .2s;}
  #lmsg{font-size:12px;color:#7d8aa3;margin-top:12px;}
</style>
</head>
<body>
<div id="loading">
  <div class="icon">🌆</div>
  <h2>SURVIVING ADAMSVILLE</h2>
  <div class="tag">MOLLIE'S EDITION</div>
  <div id="lbarwrap"><div id="lbar"></div></div>
  <div id="lmsg">Starting…</div>
</div>
<canvas id="c"></canvas>
<div id="hud"><h1>SURVIVING ADAMSVILLE</h1><div class="sub" id="loc">—</div><div class="sub" id="hint2" style="color:#7fd0ff">Walk to the car, press E to drive</div></div>
<div id="streetname">—</div>
<div id="radiobtn">📻</div>
<div id="radiopop" style="display:none;">
  <div id="rp-title">RADIO</div>
  <div id="rp-track">—</div>
  <button id="rp-prev">◀</button>
  <button id="rp-play">▶</button>
  <button id="rp-next">▶</button>
  <button id="rp-close">✕</button>
</div>
<div id="devbadge" title="Click to restart" style="cursor:pointer;"></div>
<div id="joy"><div id="stick"></div></div>
<div id="btns"><button id="bAct">ACT</button><button id="bJump">JUMP</button></div>
<div id="minimap"><canvas id="mm" width="140" height="180"></canvas></div>
<div id="kbhints">WASD move · Arrows look · E car · Mouse drag to orbit</div>
<a id="detailed-link" href="detailed/index.html" target="_blank">🔍 Detailed 3D Preview</a>
<div id="speedo">0 MPH</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="device.js?v=20261009a"></script>
<script src="world.js?v=20261009a"></script>
<script src="player.js?v=20261009a"></script>
<script src="car.js?v=20261009a"></script>
<script src="main.js?v=20261009a"></script>
</body>
</html>
