<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surviving Adamsville - Terrain 1: Google-style</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0} .legend{background:rgba(255,255,255,.94);padding:10px 12px;border-radius:8px;font:13px/1.5 system-ui;max-width:320px;box-shadow:0 1px 6px rgba(0,0,0,.3)} .legend h4{margin:0 0 6px;font-size:14px} .chip{display:inline-block;width:16px;height:12px;border-radius:2px;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}</style>
</head><body><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BORDER = {"type": "Feature", "properties": {"name": "Game border", "notes": "Vertices in order. REVISED 2026-10-14 (Joshua): NW vertex moved from the library to the Zaxby's on Floyd Rd (5090 Floyd Rd SW) to include a good portion of Clay Rd, then offset west so the South Cobb Regional Library sits exactly 100 yards INSIDE the western edge (buffer rule). The Zaxby's is the named pinpoint for this end; the corner point itself is (33.83063, -84.57853). Offset recomputed 2026-10-14 after the SW anchor moved to the Wendy's: with the western edge running Wendy's -> NW vertex, the NW corner sits 48 m further west so the library keeps its full 100-yard buffer inside the edge. NE vertex REVISED 2026-10-14 (Joshua): moved from downtown Atlanta to the Piedmont Rd NE & Monroe Dr NE junction (33.79703, -84.36902), right at Piedmont Park's southeast corner - pulls in all of Midtown and Piedmont Park. Downtown Atlanta remains a pin inside the map. SE vertex REVISED 2026-10-14 (Joshua): moved to the exact Taylor Rd & Flint River Rd junction (33.51822, -84.39097), Riverdale. SW vertex REVISED 2026-10-14 (Joshua): moved from the I-85 Fairburn exit to the Wendy's at 7835 Senoia Rd, Fairburn (33.54298, -84.57762) - the anchor for this end. The I-85 interchange now sits outside the border; downtown Fairburn (W Broad St) remains inside. Read the western border northbound: US 29 / Roosevelt Hwy runs on the RIGHT (east) side going north. SE corner pushed ~1/2 mile past the Riverdale apartments so the whole complex sits inside."}, "geometry": {"type": "Polygon", "coordinates": [[[-84.57853, 33.83063], [-84.36902, 33.79703], [-84.39097, 33.51822], [-84.57762, 33.54298], [-84.57853, 33.83063]]]}};
const PINS = [{"type": "Feature", "properties": {"name": "Zaxby's - NW pinpoint", "detail": "5090 Floyd Rd SW, Mableton, GA 30126 - Joshua's pinpoint for the northwest end (2026-10-14)"}, "geometry": {"type": "Point", "coordinates": [-84.5765, 33.83063]}}, {"type": "Feature", "properties": {"name": "South Cobb Regional Library", "detail": "805 Clay Rd SW, Mableton, GA 30126 - original NW corner; now inside the border with a 100-yard buffer"}, "geometry": {"type": "Point", "coordinates": [-84.57752, 33.82524]}}, {"type": "Feature", "properties": {"name": "Mableton Post Office", "detail": "5284 Floyd Rd SW, Mableton, GA 30126"}, "geometry": {"type": "Point", "coordinates": [-84.57652, 33.82636]}}, {"type": "Feature", "properties": {"name": "RaceTrac", "detail": "5350 Floyd Rd SW, Mableton, GA 30126 - across from the post office cluster (Joshua's memory, verified 2026-10-14)"}, "geometry": {"type": "Point", "coordinates": [-84.57639, 33.82478]}}, {"type": "Feature", "properties": {"name": "Waffle House (GA-138)", "detail": "669 GA-138 SW, Riverdale, GA 30274 - on 138 just west of Roberts Dr (verified 2026-10-14)"}, "geometry": {"type": "Point", "coordinates": [-84.4122, 33.54881]}}, {"type": "Feature", "properties": {"name": "Wendy's - SW anchor", "detail": "7835 Senoia Rd, Fairburn, GA 30213 - southwest border vertex (Joshua, 2026-10-14)"}, "geometry": {"type": "Point", "coordinates": [-84.57762, 33.54298]}}, {"type": "Feature", "properties": {"name": "Home base", "detail": "535 Dollar Mill Rd SW, Atlanta, GA 30331 (Ridgecrest Forest)"}, "geometry": {"type": "Point", "coordinates": [-84.52645, 33.7411]}}, {"type": "Feature", "properties": {"name": "Mableton", "detail": "West side (placeholder name)"}, "geometry": {"type": "Point", "coordinates": [-84.5801, 33.81877]}}, {"type": "Feature", "properties": {"name": "Riverdale High School", "detail": "160 Roberts Dr, Riverdale, GA 30274"}, "geometry": {"type": "Point", "coordinates": [-84.40224, 33.55658]}}, {"type": "Feature", "properties": {"name": "Riverdale apartments", "detail": "Placeholder - south of Riverdale High on Roberts Dr, just past the Hwy 138 light, east side heading south (exact complex TBD)"}, "geometry": {"type": "Point", "coordinates": [-84.399, 33.543]}}, {"type": "Feature", "properties": {"name": "Downtown Atlanta", "detail": "Former NE extent (until 2026-10-14); now an interior landmark"}, "geometry": {"type": "Point", "coordinates": [-84.38908, 33.7586]}}, {"type": "Feature", "properties": {"name": "Fairburn exit, I-85 S", "detail": "Former SW vertex (until 2026-10-14); now OUTSIDE the border"}, "geometry": {"type": "Point", "coordinates": [-84.60615, 33.53045]}}];

const map = L.map('map', {preferCanvas: true});
const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: 'OSM'}).addTo(map);
const tint = L.imageOverlay('terrain_tint.png', [[33.504759, -84.638672], [33.870416, -84.287109]], {opacity: 0.88}).addTo(map);
const borderLayer = L.geoJSON(BORDER, {style: {color: '#dc2626', weight: 2, fillOpacity: 0}}).addTo(map);
PINS.forEach(p => L.circleMarker([p.geometry.coordinates[1], p.geometry.coordinates[0]], {radius: 4, color: '#7c3aed'})
  .bindPopup('<b>' + p.properties.name + '</b>').addTo(map));
map.fitBounds(borderLayer.getBounds());
L.control.layers({'Streets (base)': streets}, {'Terrain tint (Google-style)': tint, 'Border (reference only)': borderLayer}, {collapsed: false}).addTo(map);
const legend = L.control({position: 'bottomright'});
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = '<h4>KEY - Terrain, Google-Maps style</h4>' +
  'Color = ground height above sea level:<br><span class='chip' style='background:#8fbf6f'></span>400&ndash;500 ft<br><span class='chip' style='background:#a9c97a'></span>500&ndash;600 ft<br><span class='chip' style='background:#c3d189'></span>600&ndash;700 ft<br><span class='chip' style='background:#dcd69a'></span>700&ndash;800 ft<br><span class='chip' style='background:#e8d9a0'></span>800&ndash;900 ft<br><span class='chip' style='background:#dfc493'></span>900&ndash;1000 ft<br><span class='chip' style='background:#d3af7e'></span>1000&ndash;1100 ft<br><span class='chip' style='background:#c49a6b'></span>1100&ndash;1200 ft<br>' +
  'Lowest ground in our map: 457 ft (river bottoms). Highest: 1149 ft (west ridges).<br>' +
  'The soft grey shading is <b>hillshade</b>: it darkens slopes that face away from the sun, ' +
  'so ridges and valleys read as 3D. Flatter = plainer color. Steeper = stronger shading.<br>' +
  'Tint is see-through at the edges so street names stay readable underneath.';
  return d; };
legend.addTo(map);
</script></body></html>
